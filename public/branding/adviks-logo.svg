<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a080c" />
      <stop offset="100%" stop-color="#140305" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="30%" stop-color="#f3d089" />
      <stop offset="70%" stop-color="#e8a93b" />
      <stop offset="100%" stop-color="#d96a2b" />
    </linearGradient>

    <!-- Inner Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="10" y="10" width="180" height="180" rx="40" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)" />

  <!-- Outer Ring Accent -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="8 4" opacity="0.6" />

  <!-- Modern Stylized "A" Monogram -->
  <g transform="translate(100, 100)">
    <!-- Left Leg of A -->
    <path d="M-36 42 L-10 -46 C-7 -52 7 -52 10 -46 L36 42 C38 47 34 52 28 52 L16 52 C12 52 9 49 8 45 L2 24 L-2 24 L-8 45 C-9 49 -12 52 -16 52 L-28 52 C-34 52 -38 47 -36 42 Z" fill="url(#goldGrad)" />
    
    <!-- Right Swoosh Wing for Tech Look -->
    <path d="M-18 8 L18 8 C22 8 24 12 22 15 L18 20 C16 23 12 24 8 24 L-12 24 Z" fill="#ffffff" opacity="0.9" />

    <!-- Center Gem / Sparkle -->
    <polygon points="0,-28 5,-16 16,-11 5,-6 0,6 -5,-6 -16,-11 -5,-16" fill="#ffffff" />
  </g>
</svg>
